[project]
name = "agenda-api"
version = "0.1.0"
description = "API de M2G Agenda — reservas y marketplace de belleza y bienestar en Panamá"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "geoalchemy2>=0.15",
    "arq>=0.26",
    "redis>=5.2",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "httpx>=0.28",
    "python-slugify>=8.0",
    "uuid-utils>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-env>=1.1",
    "ruff==0.8.4",
    "mypy>=1.13",
    "freezegun>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agenda"]

[tool.pytest.ini_options]
# Las pruebas corren con TZ=UTC a propósito: si el huso del ordenador tapara un error de
# conversión, el motor de disponibilidad pasaría en la Mac de Luis y fallaría en el servidor.
env = ["TZ=UTC"]
asyncio_mode = "auto"
testpaths = ["pruebas"]
addopts = "-q --strict-markers"
markers = [
    "bd: necesita un PostgreSQL real con PostGIS y btree_gist",
    "concurrencia: abre varias conexiones a la vez para provocar una carrera",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # El español lleva tildes en los nombres de dominio y en los mensajes; RUF001/002/003
    # los confundiría con caracteres ambiguos.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
