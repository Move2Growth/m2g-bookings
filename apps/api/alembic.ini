[alembic]
script_location = migraciones
prepend_sys_path = .
# Las revisiones se nombran con la fecha delante para que el orden del directorio coincida con
# el orden real de la historia. Sin esto, `ls` no dice nada útil en cuanto hay veinte archivos.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

# La URL no se escribe aquí: se lee del entorno en migraciones/env.py, con el rol dueño de las
# tablas (DATABASE_URL_MIGRACIONES). La aplicación NUNCA migra con su propio usuario, que no es
# dueño y no puede crear extensiones ni políticas.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = consola

[formatters]
keys = generico

[logger_root]
level = WARNING
handlers = consola
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_consola]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generico

[formatter_generico]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
