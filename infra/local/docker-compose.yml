# Entorno local de Tanda — todo el stack con un comando.
#
#   make arriba    levanta, migra y siembra
#   make abajo     para y libera puertos
#
# El nombre del proyecto es explícito a propósito: sin él, `docker compose up` en este repo
# puede recrear el Postgres de otro repo de la casa que use el mismo nombre por defecto.
name: m2g-agenda

services:
  db:
    # PostGIS, no `postgres:16` pelado: la extensión hace falta desde la primera migración.
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: agenda_owner
      POSTGRES_PASSWORD: agenda
      POSTGRES_DB: agenda
      # Sin esto, la base local nace con la configuración regional del anfitrión y los
      # ordenamientos de texto no coinciden con los del servidor de producción.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    command:
      # Los slots de replicación y el WAL no hacen falta en local; sí un log de consultas lentas,
      # que es como se detecta a tiempo una búsqueda que no usa índice.
      - postgres
      - -c
      - log_min_duration_statement=300
    ports:
      - "5433:5432"
    volumes:
      - datos_db:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda_owner -d agenda"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ── El buzón de correo de desarrollo ──────────────────────────────────────────────────────
  # Mailpit habla SMTP como cualquier proveedor y enseña lo que se manda en una web. Está por
  # el mismo motivo que el almacén: que **una máquina recién clonada pueda ver un correo de
  # verdad** —con su HTML, su asunto y su destinatario— sin credencial de nadie y sin mandarle
  # nada a una persona real. Un correo que solo existe en un fichero de registro no enseña que
  # el enlace de la invitación estaba roto.
  correo:
    image: axllent/mailpit:v1.21
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      # 1025 es SMTP; 8025 es la web donde se leen los correos.
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── El almacén de fotos ───────────────────────────────────────────────────────────────────
  # Compatible con S3, que es el estándar de hecho: el mismo código sirve para Hetzner Object
  # Storage, Cloudflare R2, Backblaze B2 o el propio Amazon. Aquí corre MinIO, que habla ese
  # idioma, para que **subir una foto funcione en una máquina recién clonada** sin una sola
  # credencial de nadie. El día que se contrate un espacio de verdad cambian cuatro variables
  # y no se toca ni una línea.
  almacen:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/datos", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-agenda-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-agenda-local-secreta}
    ports:
      # 9000 es la API de S3; 9001 es la consola web, para mirar qué hay dentro cuando algo
      # no cuadra. Las dos publicadas porque el navegador sube **directo** al almacén.
      - "9000:9000"
      - "9001:9001"
    volumes:
      - datos_almacen:/datos
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Crea el cubo y lo deja de lectura pública. Es un trabajo de una vez que termina y se va.
  #
  # **Lectura pública a propósito:** son las fotos que un salón enseña en su ficha del
  # marketplace, hechas para que las vea cualquiera y las indexe un buscador. Firmar cada
  # lectura las volvería incacheables y añadiría una petición a la API por cada imagen de cada
  # listado. Lo que no es público es **escribir**: para eso hace falta un permiso firmado.
  almacen_init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      almacen:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://almacen:9000 ${S3_ACCESS_KEY_ID:-agenda-local} ${S3_SECRET_ACCESS_KEY:-agenda-local-secreta} &&
      mc mb --ignore-existing local/${S3_BUCKET:-m2g-agenda-media-dev} &&
      mc anonymous set download local/${S3_BUCKET:-m2g-agenda-media-dev} &&
      echo 'almacén listo'
      "

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://agenda_api:agenda@db:5432/agenda
      DATABASE_URL_MIGRACIONES: postgresql+psycopg://agenda_owner:agenda@db:5432/agenda
      # Los otros tres roles también, o el contenedor busca la base en `localhost:5433`, que es
      # el puerto del portátil y dentro de Docker no existe. Se cobró una demo: la portada
      # cargaba y el marketplace daba 500 porque solo el rol público estaba mal.
      DATABASE_URL_PUBLICO: postgresql+asyncpg://agenda_publico:agenda@db:5432/agenda
      DATABASE_URL_ADMIN: postgresql+asyncpg://agenda_admin:agenda@db:5432/agenda
      DATABASE_URL_TRABAJOS: postgresql+asyncpg://agenda_admin:agenda@db:5432/agenda
      REDIS_URL: redis://redis:6379/0
      # La web de este entorno vive en el 3100, no en el 3000. Sin esto, el enlace que viaja en
      # el correo de una invitación apunta a un puerto donde no hay nada, y el fallo no se ve
      # hasta que alguien intenta aceptarla.
      URL_PUBLICA_WEB: http://localhost:3100
      # Las de la base de PRUEBAS, por el mismo motivo y con el mismo despiste: `make pruebas`
      # corre `pytest` **dentro de este contenedor**, y los conftest apuntan por defecto a
      # `localhost:5433`. Sin esto, la batería entera sale en ERROR de conexión —no en fallo—,
      # que es peor: parece un problema de entorno y se ignora.
      DATABASE_URL_PRUEBAS: postgresql+asyncpg://agenda_api:agenda@db:5432/agenda_pruebas
      DATABASE_URL_PRUEBAS_DUENO: postgresql+psycopg://agenda_owner:agenda@db:5432/agenda_pruebas
      DATABASE_URL_PRUEBAS_SISTEMA: postgresql+asyncpg://agenda_admin:agenda@db:5432/agenda_pruebas
      DATABASE_URL_DUENO_ASYNC: postgresql+asyncpg://agenda_owner:agenda@db:5432/agenda_pruebas
    ports:
      - "8000:8000"
    volumes:
      - ../../apps/api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "agenda.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    # Misma imagen que la API, otro comando: el worker no es otro proyecto.
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://agenda_api:agenda@db:5432/agenda
      DATABASE_URL_TRABAJOS: postgresql+asyncpg://agenda_admin:agenda@db:5432/agenda
      REDIS_URL: redis://redis:6379/0
      URL_PUBLICA_WEB: http://localhost:3100
    volumes:
      - ../../apps/api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["arq", "agenda.trabajos.worker.TrabajadorReactivo"]

  planificador:
    # El segundo trabajador, y hacía falta. `WorkerSettings` apunta al **reactivo**, que es el
    # que entrega lo recién encolado; los trabajos programados —recordatorios de 24 h y de 2 h,
    # la invitación a opinar, el cierre de las citas pasadas y el barrido de la cola— viven en
    # otra clase y en otra cola, y aquí no arrancaba ninguno.
    #
    # El efecto era un entorno local donde **la mitad del trabajo de fondo no ocurría nunca**:
    # las citas de ayer se quedaban en «confirmada» para siempre y no salía ni un recordatorio.
    # Se ve al mirar los datos, no el código: la lógica tiene sus pruebas, lo que faltaba era
    # el cable.
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://agenda_api:agenda@db:5432/agenda
      DATABASE_URL_TRABAJOS: postgresql+asyncpg://agenda_admin:agenda@db:5432/agenda
      REDIS_URL: redis://redis:6379/0
      URL_PUBLICA_WEB: http://localhost:3100
    volumes:
      - ../../apps/api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["arq", "agenda.trabajos.worker.TrabajadorProgramado"]

  web:
    # La web pública y los tres portales. Se construye desde la raíz del monorepo porque
    # consume `@agenda/tokens`, que es un paquete del espacio de trabajo.
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      # Dentro de la red de Docker la API es `api`; en el navegador es localhost, y por eso son
      # dos valores distintos y no uno.
      API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # El nombre comercial. Ya está decidido —**Tanda**, dirección C de la revisión 5— pero
      # sigue siendo variable: el día que cambie se cambia aquí y en el `.env`, y no se toca ni
      # una pantalla.
      NEXT_PUBLIC_NOMBRE_COMERCIAL: ${NOMBRE_COMERCIAL:-Tanda}
      # Dónde vive la web de cara al público. Es la dirección que el panel le da al salón
      # para su bio de Instagram: escrita a fuego decía `bukeo.com`, un dominio que no
      # existe. Es la misma que `URL_PUBLICA_WEB` usa la API para los enlaces que manda.
      NEXT_PUBLIC_URL_PUBLICA: http://localhost:3100
    ports:
      - "3100:3100"
    # El código va montado y el servidor corre en modo desarrollo, como la API con `--reload`.
    # Sin esto la fuente queda **dentro de la imagen**: `docker compose restart web` reconstruye
    # nada, sigue sirviendo la versión vieja y parece que el cambio no funcionó. Se pierden diez
    # minutos cada vez buscando el fallo en el sitio equivocado.
    #
    # `node_modules` se deja fuera del montaje con un volumen anónimo: los del contenedor son de
    # Linux y los del portátil de macOS, y mezclarlos rompe los binarios nativos de Next.
    volumes:
      - ../../apps/web:/repo/apps/web
      - ../../packages:/repo/packages
      - /repo/node_modules
      - /repo/apps/web/node_modules
      - /repo/apps/web/.next
    command: ["sh", "-c", "pnpm exec next dev --port 3100 --hostname 0.0.0.0"]
    depends_on:
      - api

volumes:
  datos_db:
  datos_almacen:
